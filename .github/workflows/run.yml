name: scheduled-run

# Clone the private bundle, run its pipelines on GitHub's clock, publish the
# built artifacts here, and sync results back to the private repo.
# This public repo never contains code — only workflow wiring and artifacts.

on:
  workflow_dispatch:
    inputs:
      pipelines:
        description: 'which pipelines to run (space-separated), blank = auto'
        default: ''
  schedule:
    - cron: '30 1 * * *'   # daily anchor — fleet check + build + release drip
    - cron: '0 3-23/2 * * *' # har 2 ghante — refresh + build + derive (fill-mode: poora quota)
    - cron: '0 2 * * 0'    # Sunday — GeoNames+Wikidata backlog pull

permissions:
  contents: write

concurrency:
  group: scheduled-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone private bundle
        id: clone
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
        run: |
          rm -rf core
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          git clone --depth 1 "https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git" core

      # GitHub scheduled runs delay/drop hote hain — event.schedule value ke bharose
      # mat raho (delayed run galat branch le leta hai). UTC-hour buckets delay-proof:
      # 01:30 anchor 2-3h late chale to bhi daily branch milti hai.
      - name: Decide pipelines (delay-tolerant UTC-hour buckets)
        working-directory: core
        run: |
          IN="${{ github.event.inputs.pipelines }}"
          H=$(date -u +%H); DOW=$(date -u +%u)
          if [ -n "$IN" ]; then PIPES="$IN"
          elif [ "$DOW" = "7" ] && [ "$H" = "2" ]; then PIPES="backlog refresh derive"
          elif [ "$H" = "1" ] || [ "$H" = "2" ]; then PIPES="check build release derive"
          else PIPES="refresh build derive"
          fi
          echo "decided: $PIPES (UTC hour=$H dow=$DOW)"
          echo "PIPES=$PIPES" >> "$GITHUB_ENV"

      # NOTE: PROVIDER_KEYS/SOURCE_USER are this repo's neutral secret names;
      # the pipeline step maps them onto the names the bundle's engines read.
      # CRASH-SAFE: clone ke baad kuch bhi fail ho (build mid-run, release, derive),
      # ye step + publish + sync-back phir bhi chalenge — jitna kaam hua, SAB save.
      - name: Run pipelines (generation + gates)
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          GEMINI_KEYS: ${{ secrets.PROVIDER_KEYS }}
          GEO_NAMES_USER: ${{ secrets.SOURCE_USER }}
        run: |
          for p in $PIPES; do
            case "$p" in
              check)   node engine/pipeline-health.js ;;
              build)   FACTORY_MINUTES=30 node engine/pipeline-build.js --fill ;;
              refresh) node engine/pipeline-refresh.js ;;
              release) node engine/pipeline-release.js --batch 3 --min 2 ;;
              backlog) node engine/backlog.js --pages 4 --states --min-pop 1000 && node engine/backlog-wikidata.js && node engine/priority-search.js ;;
              rank)    node engine/priority-search.js ;;
              derive)  node engine/home-cities.js && node engine/search-index.js && node engine/globe-cities.js && node engine/state-hubs.js && node engine/status.js ;;
              *) echo "unknown pipeline: $p" ;;
            esac
          done

      - name: Publish artifacts to this public repo
        if: always() && steps.clone.outcome == 'success'
        env:
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git pull --rebase origin main || true
          rm -rf site
          mkdir -p site
          # publish whatever the bundle marks as web-ready (bundle owns the list)
          if [ -f core/publish.conf ]; then
            while read -r entry; do
              case "$entry" in ''|'#'*) continue;; esac
              mkdir -p "site/$(dirname "$entry")"
              cp -r "core/$entry" "site/$entry" 2>/dev/null || true
            done < core/publish.conf
          fi
          git add site
          git diff --cached --quiet || git commit -m "artifacts: $(date -u +%F-%H%M)"
          git push

      - name: Sync results back to the private bundle
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          REMOTE="https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          git diff --cached --quiet || git commit -m "run: $(date -u +%F-%H%M)"
          # core repo run ke dauran aage badh sakta hai (deploy/manual commits) —
          # rebase + 3 retry: results kabhi reject na hon, chaahe kuch bhi push hua ho
          for i in 1 2 3; do
            git pull --rebase "$REMOTE" main && git push "$REMOTE" HEAD:main && break
            echo "sync attempt $i failed — rebasing on latest and retrying"
            sleep 5
          done
