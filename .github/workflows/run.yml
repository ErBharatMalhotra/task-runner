name: scheduled-run

# Clone the private bundle, run its pipelines on GitHub's clock, publish the
# built artifacts here, and sync results back to the private repo.
# This public repo never contains code — only workflow wiring and artifacts.

on:
  workflow_dispatch:
    inputs:
      pipelines:
        description: 'which pipelines to run (space-separated), blank = auto'
        default: ''
  schedule:
    - cron: '30 1 * * *'   # daily anchor — fleet check + build (release = dedicated release-drip workflow)
    - cron: '0 * * * *'    # hourly — refresh + build (fill-mode; throughput wall-clock × 24)
    - cron: '13 4,8,12,16,20,23 * * *'  # off-hour build insurance - GitHub drops
                            # scheduled runs unpredictably (only 4-5 of 24 actually
                            # fired/day), so book extra chances. Hour 3 is skipped
                            # so this never overlaps the 03:30 release-drip workflow.
    - cron: '0 2 * * 0'    # Sunday — GeoNames+Wikidata backlog pull

permissions:
  contents: write

concurrency:
  group: scheduled-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone private bundle
        id: clone
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
        run: |
          rm -rf core
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          git clone --depth 1 "https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git" core

      # GitHub scheduled runs delay/drop hote hain — event.schedule value ke bharose
      # mat raho (delayed run galat branch le leta hai). UTC-hour buckets delay-proof:
      # 01:30 anchor 2-3h late chale to bhi daily branch milti hai.
      - name: Decide pipelines (delay-tolerant UTC-hour buckets)
        working-directory: core
        run: |
          # Release ab dedicated release-drip workflow me hai (roz 03:30 UTC) —
          # ye bucket GitHub anchor-delay miss kar chuka tha (2026-09-29: anchor
          # push-race se fail, hour-3 bucket ban gaya, drip 1 din starve).
          # Manual dispatch se 'release' pass karna ab bhi allowed hai (console button).
          IN="${{ github.event.inputs.pipelines }}"
          H=$(date -u +%H); DOW=$(date -u +%u)
          if [ -n "$IN" ]; then PIPES="$IN"
          elif [ "$DOW" = "7" ] && [ "$H" = "2" ]; then PIPES="backlog refresh derive"
          else PIPES="refresh build derive"
          fi
          echo "decided: $PIPES (UTC hour=$H dow=$DOW)"
          echo "PIPES=$PIPES" >> "$GITHUB_ENV"

      # NOTE: PROVIDER_KEYS/SOURCE_USER are this repo's neutral secret names;
      # the pipeline step maps them onto the names the bundle's engines read.
      # CRASH-SAFE: clone ke baad kuch bhi fail ho (build mid-run, release, derive),
      # ye step + publish + sync-back phir bhi chalenge — jitna kaam hua, SAB save.
      - name: Run pipelines (generation + gates)
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          GEMINI_KEYS: ${{ secrets.PROVIDER_KEYS }}
          GEO_NAMES_USER: ${{ secrets.SOURCE_USER }}
        run: |
          for p in $PIPES; do
            case "$p" in
              check)   node engine/pipeline-health.js ;;
              # Authoring throughput. Measured cost per city was 208s against 18s of
              # LLM time (a blocking 60s cooldown on every minute-429), and only
              # 4-5 of 24 hourly runs actually fired. The bundle now walks to the
              # next fleet slot instead of sleeping, and runs 4 city workers -
              # 208s -> 18s per city, so one 70-min pass authors ~230 cities.
              #
              # GEMINI_RPD=250: the old default of 25 made the ceiling 11*25=275,
              # but the real quota never trips - three consecutive days logged
              # 286, 289 and 725 calls with ZERO day-429s, and one model took
              # 286 calls in a day alone. At 275 the first pass burned the whole
              # budget and every later run in the IST day sat idle on "quota
              # already full". 250 puts the ceiling at 2750, below the 286 a
              # single model already used, and lib/llm.js day-trips any model
              # that does 429 for real - so over-shooting degrades instead of
              # failing.
              build)   GEMINI_RPD=250 FACTORY_MINUTES=70 FACTORY_PARALLEL=4 node engine/pipeline-build.js --fill ;;
              refresh) node engine/pipeline-refresh.js ;;
              release) node engine/pipeline-release.js --batch 3 --min 2 ;;
              backlog) node engine/backlog.js --pages 4 --states --min-pop 1000 && node engine/backlog-wikidata.js && node engine/priority-search.js ;;
              rank)    node engine/priority-search.js ;;
              derive)  node engine/home-cities.js && node engine/search-index.js && node engine/globe-cities.js && node engine/state-hubs.js && node engine/status.js && node engine/build-home-stats.js ;;
              *) echo "unknown pipeline: $p" ;;
            esac
          done
          # UNIVERSAL RULE: har run ke end me derive — status.json/home/globe/search-index
          # har run ke baad fresh (build-only runs se console stale nahi rehta).
          # build-home-stats LAST — woh status.json ka releasedTotal padhta hai, isliye
          # status.js ke baad hi chalna chahiye. Iske derive se missing hone ki wajah se
          # homepage tiles 119 pe atak gaye the jabki 125 cities live thi.
          case " $PIPES " in
            *" derive "*) ;; # already ran
            *) node engine/home-cities.js && node engine/search-index.js && node engine/globe-cities.js && node engine/state-hubs.js && node engine/status.js && node engine/build-home-stats.js ;;
          esac

      - name: Publish artifacts to this public repo
        if: always() && steps.clone.outcome == 'success'
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          # `git pull ... || truerm -rf site` tha: shell ne usse ek hi command
          # truerm maana, isliye `rm -rf site` kabhi chala hi nahi. Do saaf lines:
          git pull --rebase origin main || true

          # STALE-CLONE GUARD: a long run can finish after another run has
          # already published newer artifacts (2026-10-04: a scheduled-run that
          # started before the release-drip wiped the drip's 13 new pages).
          # Never publish a tree that is behind what is already live.
          STALE=0; REASON=""
          if [ -n "$CORE_TOKEN" ] && [ -n "$CORE_REPO" ]; then
            CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
            if git -C core fetch -q "https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git" main; then
              if [ "$(git -C core rev-parse HEAD)" != "$(git -C core rev-parse FETCH_HEAD)" ]; then
                STALE=1; REASON="the bundle remote moved ahead of this clone"
              fi
            else
              echo "WARN: bundle fetch failed - proceeding without the remote check"
            fi
          fi
          PUBLISHED=$(node -e "try{const j=require('./site/data/cities-live.json');console.log((j.cities||j).length||0)}catch{console.log(0)}" 2>/dev/null || echo 0)
          CLONED=$(node -e "const r=require('./core/data/release-log.json');console.log((r.released||[]).length)" 2>/dev/null || echo 0)
          if [ "$CLONED" -lt "$PUBLISHED" ]; then
            STALE=1; REASON="published tree has $PUBLISHED cities, this clone has $CLONED"
          fi
          if [ "$STALE" = "1" ]; then
            echo "publish skipped - $REASON"
          else
          rm -rf site
          mkdir -p site
          # publish whatever the bundle marks as web-ready (bundle owns the list)
          # `read` strips the newline but NOT a CR, so a CRLF publish.conf fed
          # "index.html\r" to cp and every copy failed — silently, because of
          # the 2>/dev/null || true below. The bundle is stored with LF now; the
          # ${raw%$'\r'} and the explicit WARN lines keep the next occurrence
          # of this loud instead of invisible.
          COPIED=0; MISSING=0; FAILED=0
          if [ -f core/publish.conf ]; then
            while IFS= read -r raw || [ -n "$raw" ]; do
              entry="${raw%$'\r'}"
              case "$entry" in ''|'#'*) continue;; esac
              mkdir -p "site/$(dirname "$entry")"
              # publish.conf lists directories with a trailing slash (city/, state/,
              # assets/). `cp -r core/city/ site/city/` nests, producing site/city/city
              # — which shipped 179 duplicate pages live, each with its own canonical.
              # Strip the slash, and clear the destination first so a rename can never
              # leave a stale copy behind.
              src="core/${entry%/}"; dst="site/${entry%/}"
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              if [ -e "$src" ]; then
                if cp -r "$src" "$dst"; then COPIED=$((COPIED+1)); else echo "  WARN: copy FAILED for $entry"; FAILED=$((FAILED+1)); fi
              else
                echo "  WARN: publish.conf lists '$entry' but it is not in the clone"; MISSING=$((MISSING+1))
              fi
            done < core/publish.conf
          else
            echo "  WARN: core/publish.conf not found — nothing published"
          fi
          echo "publish: $COPIED path(s) copied, $MISSING missing, $FAILED failed"

          # Structural gate on the copy that is about to be published. Runs only
          # when something was actually copied, so a no-op refresh pass is not
          # failed by stale artifacts sitting in site/. A failure here stops the
          # push, so a broken publish cannot reach the live site.
          if [ "$COPIED" -gt 0 ]; then
            echo "::group::site health gate"
            node scripts/site-health.mjs site
            echo "::endgroup::"
          else
            echo "site health gate skipped — nothing was copied this pass"
          fi

          git add site
          git diff --cached --quiet || git commit -m "artifacts: $(date -u +%F-%H%M)"
          git push
          fi

      - name: Sync results back to the private bundle
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          REMOTE="https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          git diff --cached --quiet || git commit -m "run: $(date -u +%F-%H%M)"
          # SAVE-ON-CONFLICT (2026-10-04): ek late run ka rebase derived views par
          # conflict hua, retry loop wahi stuck rebase dobara hit karta raha, aur
          # step phir bhi green exit hua — 142 authored cities runner ke saath
          # gayab. Rules ab: derived view bundle ki newer copy ko overwrite nahi
          # karega, append-logs dono taraf ka union honge, baaki sab (specs/pool/
          # facts/pages) is run ka rahega; jo sync sac mein fail ho woh laal ho.
          SYNCED=0
          for i in 1 2 3; do
            if git pull --rebase "$REMOTE" main && git push "$REMOTE" HEAD:main; then SYNCED=1; break; fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "sync: conflicts (attempt $i): $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  data/release-log.json|data/gen-log.json)
                    # append-only logs: union by key — koi run apni entries na khoye
                    if node -e "
                      const cp = require('child_process'), fs = require('fs');
                      const p = process.argv[1];
                      const rd = (s) => JSON.parse(cp.execSync('git show ' + s + ':' + p, { maxBuffer: 64 * 1024 * 1024 }).toString());
                      const key = (k, x) => k === 'generated' ? (x.slug + '|' + (x.at || '')) : (x.slug || JSON.stringify(x));
                      const up = rd(':2'), me = rd(':3');
                      const out = Object.assign({}, up);
                      for (const k of ['released', 'skipped', 'generated']) {
                        if (!up[k] && !me[k]) continue;
                        const seen = new Set((up[k] || []).map((x) => key(k, x)));
                        out[k] = (up[k] || []).concat((me[k] || []).filter((x) => !seen.has(key(k, x))));
                      }
                      fs.writeFileSync(p, JSON.stringify(out, null, 2) + '\n');
                    " "$f"; then git add "$f"; else echo "  WARN: union failed for $f"; fi ;;
                  data/status.json|data/home-stats.json|data/cities-live.json|data/city-index.json|data/state-hubs.json|search-index.json|index.html)
                    # derived views: bundle ki newer copy jeete
                    if git checkout --ours -- "$f" 2>/dev/null; then git add "$f"; else echo "  WARN: could not take the bundle copy of $f"; fi ;;
                  *)
                    # authored artifacts (specs/pool/facts/pages): is run ka version jeete
                    if git checkout --theirs -- "$f" 2>/dev/null; then git add "$f"; else echo "  WARN: could not keep this run's $f"; fi ;;
                esac
              done
              RC=0
              if git diff --cached --quiet; then
                git rebase --skip >/dev/null 2>&1 || RC=1
              else
                git -c core.editor=true rebase --continue >/dev/null 2>&1 || RC=1
              fi
              if [ "$RC" = "0" ] && git push "$REMOTE" HEAD:main; then SYNCED=1; break; fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "sync attempt $i failed — rebasing on latest and retrying"
            sleep 5
          done
          if [ "$SYNCED" != "1" ]; then
            echo "::error::sync-back failed after 3 attempts - this run's results were NOT saved"
            exit 1
          fi
