name: release-drip

# Dedicated daily drip: publish authored cities, then refresh derived pages +
# status. WHY SEPARATE FROM scheduled-run: the hourly bucket logic
# (`H == 1 || H == 2`) missed release when GitHub delayed the anchor past 03:00
# UTC (happened 2026-09-29 — push race failed the anchor, bucket became
# refresh/build/derive, drip starved for a day with 52 cities ready). A cron
# with its own workflow needs NO window logic — whenever it runs, it releases.
# Race-safe: sync-back uses rebase+retry; concurrency group is its own, and a
# concurrent scheduled-run can interleave (same clone → rebase → push pattern).
#
# TIERED RAMP (approved 2026-10-04): ~1,500 authored cities are waiting and a
# flat 3/day drip would take months to surface them. Top tiers (queue tier 1-2)
# get a 10/day budget; the long tail keeps the original 3/day GSC-safe pace.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'max tail cities to drip this pass'
        default: '3'
      top_batch:
        description: 'max top-tier (1-2) cities to drip this pass'
        default: '10'
  schedule:
    - cron: '30 3 * * *'   # daily 03:30 UTC = 09:00 IST — after the anchor build

permissions:
  contents: write

concurrency:
  group: release-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone private bundle
        id: clone
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
        run: |
          rm -rf core
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          git clone --depth 1 "https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git" core

      - name: Release drip — top tiers (queue tier 1-2)
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          RELEASE_TIER_CAP: '2'
        run: node engine/pipeline-release.js --batch ${{ github.event.inputs.top_batch || 10 }} --min 0

      - name: Release drip — tail
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        run: node engine/pipeline-release.js --batch ${{ github.event.inputs.batch || 3 }} --min 0

      - name: Derive (home, search, globe, hubs, status, home-stats)
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        run: node engine/home-cities.js && node engine/search-index.js && node engine/globe-cities.js && node engine/state-hubs.js && node engine/status.js && node engine/build-home-stats.js

      - name: Publish artifacts to this public repo
        if: always() && steps.clone.outcome == 'success'
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git pull --rebase origin main || true

          # STALE-CLONE GUARD: a long run can finish after another run has
          # already published newer artifacts (2026-10-04: a scheduled-run that
          # started before the release-drip wiped the drip's 13 new pages).
          # Never publish a tree that is behind what is already live.
          STALE=0; REASON=""
          if [ -n "$CORE_TOKEN" ] && [ -n "$CORE_REPO" ]; then
            CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
            if git -C core fetch -q "https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git" main; then
              if [ "$(git -C core rev-parse HEAD)" != "$(git -C core rev-parse FETCH_HEAD)" ]; then
                STALE=1; REASON="the bundle remote moved ahead of this clone"
              fi
            else
              echo "WARN: bundle fetch failed - proceeding without the remote check"
            fi
          fi
          PUBLISHED=$(node -e "try{const j=require('./site/data/cities-live.json');console.log((j.cities||j).length||0)}catch{console.log(0)}" 2>/dev/null || echo 0)
          CLONED=$(node -e "const r=require('./core/data/release-log.json');console.log((r.released||[]).length)" 2>/dev/null || echo 0)
          if [ "$CLONED" -lt "$PUBLISHED" ]; then
            STALE=1; REASON="published tree has $PUBLISHED cities, this clone has $CLONED"
          fi
          if [ "$STALE" = "1" ]; then
            echo "publish skipped - $REASON"
          else
          rm -rf site
          mkdir -p site
          COPIED=0
          if [ -f core/publish.conf ]; then
            while IFS= read -r raw || [ -n "$raw" ]; do
              entry="${raw%$'\r'}"
              case "$entry" in ''|'#'*) continue;; esac
              mkdir -p "site/$(dirname "$entry")"
              # Same two lessons as run.yml: a stray \r made every cp fail while the
              # job still reported success, and a trailing slash (city/, state/,
              # assets/) made cp nest into site/city/city — 179 duplicate pages shipped
              # live that way. Strip the slash and clear the destination first.
              src="core/${entry%/}"; dst="site/${entry%/}"
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              if cp -r "$src" "$dst" 2>/dev/null; then COPIED=$((COPIED+1)); else echo "  WARN: copy FAILED for $entry"; fi
            done < core/publish.conf
          else
            echo "  WARN: core/publish.conf not found — nothing published"
          fi
          echo "publish: $COPIED path(s) copied"

          # NEVER publish a partial or empty tree: on 2026-10-03/04 every cp
          # failed on a CRLF publish.conf (after `rm -rf site`), so the runner
          # committed an empty site/ and the whole deploy 404'd overnight —
          # Google's sitemap read hit that window (GSC still shows the 404).
          # Zero copies or a missing root file now stop the publish before
          # anything is committed or pushed.
          REQUIRED_MISSING=0
          for rf in index.html sitemap.xml robots.txt 404.html _headers _redirects; do
            [ -e "site/$rf" ] || { echo "  WARN: required root file site/$rf is missing"; REQUIRED_MISSING=1; }
          done
          if [ "$COPIED" -eq 0 ] || [ "$REQUIRED_MISSING" = "1" ]; then
            echo "::error::refusing to publish - copied=$COPIED required-missing=$REQUIRED_MISSING"
            exit 1
          fi

          # Structural gate on what is about to be published: broken internal
          # links, canonical mismatches, dead redirects, sitemap URLs with no
          # page. A failure stops the push instead of shipping it. Skipped when
          # nothing was copied, so an empty pass is not failed by stale output.
          if [ "$COPIED" -gt 0 ]; then
            echo "::group::site health gate"
            node scripts/site-health.mjs site
            echo "::endgroup::"
          else
            echo "site health gate skipped — nothing was copied this pass"
          fi

          git add site
          git diff --cached --quiet || git commit -m "artifacts: $(date -u +%F-%H%M)"
          git push
          fi

      - name: Sync results back to the private bundle
        if: always() && steps.clone.outcome == 'success'
        working-directory: core
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ vars.CORE_REPO }}
          GIT_AUTHOR_NAME: Bharat Malhotra
          GIT_AUTHOR_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
          GIT_COMMITTER_NAME: Bharat Malhotra
          GIT_COMMITTER_EMAIL: 85725773+ErBharatMalhotra@users.noreply.github.com
        run: |
          CLEAN="$(printf '%s' "$CORE_TOKEN" | tr -d '\r\n\t \"')"
          REMOTE="https://x-access-token:${CLEAN}@github.com/${CORE_REPO}.git"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          git diff --cached --quiet || git commit -m "drip: $(date -u +%F-%H%M)"
          # SAVE-ON-CONFLICT (2026-10-04): ek late run ka rebase derived views par
          # conflict hua, retry loop wahi stuck rebase dobara hit karta raha, aur
          # step phir bhi green exit hua — 142 authored cities runner ke saath
          # gayab. Rules ab: derived view bundle ki newer copy ko overwrite nahi
          # karega, append-logs dono taraf ka union honge, baaki sab (specs/pool/
          # facts/pages) is run ka rahega; jo sync sac mein fail ho woh laal ho.
          SYNCED=0
          for i in 1 2 3; do
            if git pull --rebase "$REMOTE" main && git push "$REMOTE" HEAD:main; then SYNCED=1; break; fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "sync: conflicts (attempt $i): $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  data/release-log.json|data/gen-log.json)
                    # append-only logs: union by key — koi run apni entries na khoye
                    if node -e "
                      const cp = require('child_process'), fs = require('fs');
                      const p = process.argv[1];
                      const rd = (s) => JSON.parse(cp.execSync('git show ' + s + ':' + p, { maxBuffer: 64 * 1024 * 1024 }).toString());
                      const key = (k, x) => k === 'generated' ? (x.slug + '|' + (x.at || '')) : (x.slug || JSON.stringify(x));
                      const up = rd(':2'), me = rd(':3');
                      const out = Object.assign({}, up);
                      for (const k of ['released', 'skipped', 'generated']) {
                        if (!up[k] && !me[k]) continue;
                        const seen = new Set((up[k] || []).map((x) => key(k, x)));
                        out[k] = (up[k] || []).concat((me[k] || []).filter((x) => !seen.has(key(k, x))));
                      }
                      fs.writeFileSync(p, JSON.stringify(out, null, 2) + '\n');
                    " "$f"; then git add "$f"; else echo "  WARN: union failed for $f"; fi ;;
                  data/status.json|data/home-stats.json|data/cities-live.json|data/city-index.json|data/state-hubs.json|search-index.json|index.html)
                    # derived views: bundle ki newer copy jeete
                    if git checkout --ours -- "$f" 2>/dev/null; then git add "$f"; else echo "  WARN: could not take the bundle copy of $f"; fi ;;
                  *)
                    # authored artifacts (specs/pool/facts/pages): is run ka version jeete
                    if git checkout --theirs -- "$f" 2>/dev/null; then git add "$f"; else echo "  WARN: could not keep this run's $f"; fi ;;
                esac
              done
              RC=0
              if git diff --cached --quiet; then
                git rebase --skip >/dev/null 2>&1 || RC=1
              else
                git -c core.editor=true rebase --continue >/dev/null 2>&1 || RC=1
              fi
              if [ "$RC" = "0" ] && git push "$REMOTE" HEAD:main; then SYNCED=1; break; fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "sync attempt $i failed — rebasing on latest and retrying"
            sleep 5
          done
          if [ "$SYNCED" != "1" ]; then
            echo "::error::sync-back failed after 3 attempts - this run's results were NOT saved"
            exit 1
          fi
